[project]
name = "agent-factory"
version = "0.1.0"
description = "A Databricks Declarative Automation Bundle that turns a domain metadata file into a governed, evaluated set of AI agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "databricks-ai-search>=0.78",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyspark>=3.5,<3.6",
    "delta-spark>=3.2,<3.3",
    "databricks-sdk>=0.40",
    "mlflow[databricks]>=3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory", "src", "gates"]
