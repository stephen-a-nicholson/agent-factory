          "instructions": {
            "text_instructions": [
              {
                "id": "18ae99b4870c6b47ea2a422cec5a612a",
                "content": [
                  "all_ticket_entries_exits is the total annual entries and exits across\nall ticket types (full price, reduced price and season tickets\ncombined); full_price_entries_exits, reduced_price_entries_exits and\nseason_ticket_entries_exits are the components of that total, not\nseparate figures to add on top of it.\nusage_rank is the station's national rank by all_ticket_entries_exits,\n1 being the busiest station in Great Britain. Lower usage_rank means\nbusier, not less used.\ninterchanges is the number of passengers who changed trains at that\nstation as part of their journey, not a count of distinct connecting\nroutes or platforms.\nmain_destination_station and journeys_to_main_destination describe\nthe single most common origin or destination paired with this\nstation, not the total number of destinations served from it.\nA null value in any numeric column means the figure was suppressed or\nnot applicable in the source data (shown as \"[z]\" or \"[low]\" in the\noriginal ORR release), not that usage was zero; do not report a null\nas 0."
                ]
              }
            ]
          }
