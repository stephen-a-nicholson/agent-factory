  alerts:
    uk_rail_eval_regression:
      display_name: 'UK Rail Analyst: RAG evaluation regression'
      warehouse_id: ${var.warehouse_id}
      query_text: |
        WITH latest AS (
          SELECT metric, score,
                 ROW_NUMBER() OVER (PARTITION BY metric ORDER BY timestamp DESC) AS rn
          FROM ${var.catalog}.${resources.schemas.agent_factory.name}.eval_results
          WHERE domain = 'uk_rail' AND target = '${bundle.target}' AND metric LIKE 'rag_eval.%'
        ),
        thresholds(metric, threshold) AS (VALUES ('rag_eval.correctness', 0.9), ('rag_eval.groundedness', 0.8))
        SELECT MIN(latest.score - thresholds.threshold) AS margin
        FROM thresholds
        JOIN latest ON latest.metric = thresholds.metric AND latest.rn = 1
      evaluation:
        comparison_operator: LESS_THAN
        source:
          name: margin
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
      schedule:
        quartz_cron_schedule: 0 0 8 * * ?
        timezone_id: UTC
