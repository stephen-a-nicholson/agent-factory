# The domain contract. See docs/DESIGN.md section 3 for the full annotated
# reference. This file is intentionally the only thing a consumer of the
# factory needs to write; everything under resources/generated/ is derived
# from it by factory/generate.py.
#
# Phase 2 status: structured, genie, documents and rag blocks all present.
name: f1
display_name: Formula 1 Analyst
description: >
  Answers questions about Formula 1 results since 2020 and the FIA
  regulations that govern the sport.
owner: stephennicholson14@gmail.com
tags:
  cost_centre: demo
  data_classification: public

structured:
  loader: parquet_folder
  source: data/
  tables:
    - name: races
      primary_key: race_id
      description: One row per Grand Prix
    - name: results
      primary_key: [race_id, driver_id]
      description: Finishing position, points and status per driver per race
    - name: drivers
      primary_key: driver_id
      description: One row per driver
    - name: constructors
      primary_key: constructor_id
      description: One row per constructor
    - name: pit_stops
      primary_key: [race_id, driver_id, stop]
      description: One row per pit stop
  relationships:
    - from: results.race_id
      to: races.race_id
    - from: results.driver_id
      to: drivers.driver_id
    - from: results.constructor_id
      to: constructors.constructor_id
    - from: pit_stops.race_id
      to: races.race_id
    - from: pit_stops.driver_id
      to: drivers.driver_id

genie:
  enabled: true
  instructions: |
    Points are awarded 25-18-15-12-10-8-6-4-2-1 for positions 1 to 10.
    A podium is a finish in position 1, 2 or 3.
    In the results table, status "Finished", the exact status "Lapped", or
    a lapped count such as "+1 Lap" all mean the driver was classified at
    the end of the race, just not on the lead lap. Any other status (for
    example "Collision", "Engine", "Accident") means the driver did not
    finish (DNF); the status text is the reason. Do not treat "Lapped" as
    a DNF: it is a distinct status from the "+N Lap(s)" family and easy to
    miss if you only filter on the "+" prefix.
    pit_stops.duration_seconds is time in the pit lane, not just time
    stationary. It can include long outliers (tens of minutes) from red
    flags or race stoppages while a car sits in the pits: for "average" or
    "fastest" pit stop questions, use the median, or filter to stops under
    60 seconds, rather than a plain mean, unless the question explicitly
    asks about stoppage-affected stops.
  sample_questions:
    - Who scored the most points in 2025?
    - Which constructor had the fastest average pit stop in 2024?
    - How many races did each driver retire from in 2023?
  benchmarks: eval/genie.jsonl

documents:
  loader: url_list
  sources:
    - url: https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_b_sporting_-_iss_05_-_2026-02-27.pdf
      title: 2026 Sporting Regulations
      category: sporting
    - url: https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_c_technical_-_iss_17_-_2026-04-28.pdf
      title: 2026 Technical Regulations
      category: technical
    - url: https://www.fia.com/system/files/documents/fia_2026_f1_regulations_-_section_d_financial_regulations_-_f1_teams_iss_04_-_2025-12-10_0.pdf
      title: 2026 Financial Regulations
      category: financial
  embedding_model: databricks-gte-large-en

rag:
  enabled: true
  llm: databricks-meta-llama-3-3-70b-instruct
  system_prompt: |
    You answer questions about Formula 1 regulations using the retriever
    tool. Only cite an article number if it appears in the text the
    retriever actually returned; if the retriever found no matching
    passages, say so plainly rather than guessing an article number from
    general knowledge. If the question is about race results, points,
    standings or pit stops rather than regulations, call the Genie tool
    instead of guessing, and do not invent statistics.
  retriever:
    top_k: 6
    filter_columns: [category]
  tools:
    genie: true
  eval:
    dataset: eval/rag.jsonl
    judges: [correctness, groundedness, relevance]
    # Set from a real evaluate_f1 run against this eval set (correctness
    # 0.76, groundedness 0.80, relevance 1.0), not chosen upfront: with the
    # Genie tool enabled, RetrievalGroundedness only checks a claim against
    # the RETRIEVER span, so any combined question whose answer cites a
    # Genie-derived stat cannot be grounded by that judge even when the
    # stat itself is correct, which structurally caps groundedness below
    # what a documents-only domain could reach. See docs/DESIGN.md section
    # 8 and docs/PLAN.md notes, phase 3.
    promotion_threshold:
      correctness: 0.70
      groundedness: 0.75
